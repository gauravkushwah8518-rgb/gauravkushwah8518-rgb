<svg width="620" height="280" viewBox="0 0 620 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal showing profile.json">
  <defs>
    <linearGradient id="ti-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3F3F46"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>
    <linearGradient id="ti-cursor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="ti-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- window -->
  <rect x="0.75" y="0.75" width="618.5" height="278.5" rx="11" fill="#1E1E26" stroke="url(#ti-border)" stroke-width="1.5"/>
  <!-- title bar -->
  <path d="M0.75,11.75 a11,11 0 0 1 11,-11 h596.5 a11,11 0 0 1 11,11 v16.25 h-618.5 Z" fill="#2A2A33"/>
  <rect x="0.75" y="28" width="618.5" height="0.5" fill="#3F3F46"/>

  <!-- traffic lights -->
  <circle cx="22" cy="15" r="5" fill="#FF5F57"/>
  <circle cx="37" cy="15" r="5" fill="#FEBC2E"/>
  <circle cx="52" cy="15" r="5" fill="#28C840"/>

  <!-- title -->
  <text x="310" y="19" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Menlo,Consolas,'Courier New',monospace" font-size="10" fill="#9D9DA7">gaurav@dev — zsh</text>

  <!-- content -->
  <g font-family="'SF Mono','Cascadia Code',Menlo,Consolas,'Courier New',monospace" font-size="13">
    <!-- prompt + command -->
    <text x="30" y="58" filter="url(#ti-glow)">
      <tspan fill="#A855F7">❯</tspan> <tspan fill="#E4E4E7">cat profile.json</tspan>
    </text>

    <!-- JSON output : keys green, colons dim, values white — aligned columns -->
    <text x="30" y="84" fill="#A1A1AC">{</text>

    <text x="46" y="106" fill="#4ADE80">"name"</text>
    <text x="128" y="106" fill="#A1A1AC">:</text>
    <text x="140" y="106" fill="#E4E4E7">"Gaurav Kushwah"</text>

    <text x="46" y="128" fill="#4ADE80">"role"</text>
    <text x="128" y="128" fill="#A1A1AC">:</text>
    <text x="140" y="128" fill="#E4E4E7">"Frontend Developer"</text>

    <text x="46" y="150" fill="#4ADE80">"location"</text>
    <text x="128" y="150" fill="#A1A1AC">:</text>
    <text x="140" y="150" fill="#E4E4E7">"Gwalior, India 🇮🇳"</text>

    <text x="46" y="172" fill="#4ADE80">"focus"</text>
    <text x="128" y="172" fill="#A1A1AC">:</text>
    <text x="140" y="172" fill="#E4E4E7">"UI/UX, Three.js/GSAP, clean UI"</text>

    <text x="46" y="194" fill="#4ADE80">"status"</text>
    <text x="128" y="194" fill="#A1A1AC">:</text>
    <text x="140" y="194" fill="#E4E4E7">"Open to internships &amp; collabs"</text>

    <text x="30" y="220" fill="#A1A1AC">}</text>

    <!-- fresh prompt + blinking cursor -->
    <text x="30" y="252" fill="#A855F7">❯</text>
    <rect x="45" y="239" width="9" height="15" fill="url(#ti-cursor)">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

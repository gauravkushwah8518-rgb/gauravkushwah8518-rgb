<svg width="660" height="310" viewBox="0 0 660 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal showing profile.json">
  <defs>
    <linearGradient id="ti-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3F3F46"/>
      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>
    <linearGradient id="ti-cursor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="ti-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- window -->
  <rect x="0.75" y="0.75" width="658.5" height="308.5" rx="12" fill="#1E1E26" stroke="url(#ti-border)" stroke-width="1.5"/>
  <!-- title bar -->
  <path d="M0.75,12.75 a12,12 0 0 1 12,-12 h634.5 a12,12 0 0 1 12,12 v21.25 h-658.5 Z" fill="#2A2A33"/>
  <rect x="0.75" y="34" width="658.5" height="0.5" fill="#3F3F46"/>

  <!-- traffic lights -->
  <circle cx="22" cy="18" r="6" fill="#FF5F57"/>
  <circle cx="42" cy="18" r="6" fill="#FEBC2E"/>
  <circle cx="62" cy="18" r="6" fill="#28C840"/>

  <!-- title -->
  <text x="330" y="23" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#9D9DA7">gaurav@dev — zsh</text>

  <!-- content -->
  <g font-family="'SF Mono','Cascadia Code',Menlo,Consolas,'Courier New',monospace" font-size="13.5">
    <!-- prompt + command -->
    <text x="30" y="74" filter="url(#ti-glow)">
      <tspan fill="#A855F7">❯</tspan> <tspan fill="#E4E4E7">cat profile.json</tspan>
    </text>

    <!-- JSON output : keys green, colons dim, values white — aligned columns -->
    <text x="30" y="108" fill="#A1A1AC">{</text>

    <text x="54" y="136" fill="#4ADE80">"name"</text>
    <text x="140" y="136" fill="#A1A1AC">:</text>
    <text x="156" y="136" fill="#E4E4E7">"Gaurav Kushwah"</text>

    <text x="54" y="162" fill="#4ADE80">"role"</text>
    <text x="140" y="162" fill="#A1A1AC">:</text>
    <text x="156" y="162" fill="#E4E4E7">"Frontend Developer"</text>

    <text x="54" y="188" fill="#4ADE80">"location"</text>
    <text x="140" y="188" fill="#A1A1AC">:</text>
    <text x="156" y="188" fill="#E4E4E7">"Gwalior, India 🇮🇳"</text>

    <text x="54" y="214" fill="#4ADE80">"focus"</text>
    <text x="140" y="214" fill="#A1A1AC">:</text>
    <text x="156" y="214" fill="#E4E4E7">"UI/UX, Three.js/GSAP, clean UI"</text>

    <text x="54" y="240" fill="#4ADE80">"status"</text>
    <text x="140" y="240" fill="#A1A1AC">:</text>
    <text x="156" y="240" fill="#E4E4E7">"Open to internships &amp; collabs"</text>

    <text x="30" y="268" fill="#A1A1AC">}</text>

    <!-- fresh prompt + blinking cursor -->
    <text x="30" y="296" fill="#A855F7">❯</text>
    <rect x="48" y="284" width="9" height="16" fill="url(#ti-cursor)">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

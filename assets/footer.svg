<svg width="900" height="130" viewBox="0 0 900 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2975"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#2DE2E6"/>
    </linearGradient>
    <filter id="fglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="130" fill="#0A0514"/>
  <path d="M0,46 C150,14 300,78 450,46 C600,14 750,78 900,46 L900,130 L0,130 Z" fill="url(#wave)" opacity="0.22">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0,46 C150,14 300,78 450,46 C600,14 750,78 900,46 L900,130 L0,130 Z;
              M0,52 C150,82 300,18 450,52 C600,82 750,18 900,52 L900,130 L0,130 Z;
              M0,46 C150,14 300,78 450,46 C600,14 750,78 900,46 L900,130 L0,130 Z"/>
  </path>
  <path d="M0,64 C150,34 300,94 450,64 C600,34 750,94 900,64 L900,130 L0,130 Z" fill="url(#wave)" opacity="0.12">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="M0,64 C150,34 300,94 450,64 C600,34 750,94 900,64 L900,130 L0,130 Z;
              M0,70 C150,100 300,40 450,70 C600,100 750,40 900,70 L900,130 L0,130 Z;
              M0,64 C150,34 300,94 450,64 C600,34 750,94 900,64 L900,130 L0,130 Z"/>
  </path>

  <text x="450" y="62" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" fill="#F5D0FE" filter="url(#fglow)">
    Thanks for stopping by — always building something new.
  </text>
  <text x="450" y="90" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#F472B6">
    — Gaurav Kushwah<tspan fill="#A78BFA">_</tspan><tspan fill="#A78BFA" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="1.1s" repeatCount="indefinite"/></tspan>
  </text>
</svg>

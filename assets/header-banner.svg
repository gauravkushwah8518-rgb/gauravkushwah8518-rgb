<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gaurav Kushwah — Frontend Developer">
  <defs>
    <radialGradient id="hb-vign" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1D1132" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0F0F17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hb-orbL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C026D3" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#C026D3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hb-orbR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hb-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D946EF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#E553E0" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#A855F7"/>
      <stop offset="85%" stop-color="#D946EF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#C026D3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hb-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F06BE0"/>
      <stop offset="50%" stop-color="#C553E8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <!-- soft breathing neon glow behind the name -->
    <filter id="hb-glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="h1">
        <animate attributeName="stdDeviation" values="10;15;10" dur="5s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feFlood flood-color="#C026D3" flood-opacity="0.5" result="c1"/>
      <feComposite in="c1" in2="h1" operator="in" result="g1"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="h2">
        <animate attributeName="stdDeviation" values="3;6;3" dur="5s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feFlood flood-color="#A855F7" flood-opacity="0.65" result="c2"/>
      <feComposite in="c2" in2="h2" operator="in" result="g2"/>
      <feMerge>
        <feMergeNode in="g1"/>
        <feMergeNode in="g2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="hb-ruleglow" x="-5%" y="-400%" width="110%" height="900%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="900" height="220" fill="#0F0F17"/>
  <rect width="900" height="220" fill="url(#hb-vign)"/>
  <ellipse cx="140" cy="40" rx="250" ry="130" fill="url(#hb-orbL)">
    <animate attributeName="cx" values="140;220;140" dur="13s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="780" cy="190" rx="260" ry="130" fill="url(#hb-orbR)">
    <animate attributeName="cx" values="780;690;780" dur="15s" repeatCount="indefinite"/>
  </ellipse>

  <!-- top gradient rule -->
  <rect x="70" y="14" width="760" height="2.5" rx="1.25" fill="url(#hb-rule)" filter="url(#hb-ruleglow)"/>

  <!-- name -->
  <text x="450" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="url(#hb-name)" filter="url(#hb-glow)" letter-spacing="6">GAURAV KUSHWAH</text>

  <!-- tagline -->
  <text x="450" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#A1A1AC" letter-spacing="3.5">FRONTEND DEVELOPER • UI/UX BUILDER • IMMERSIVE WEB CRAFTSMAN</text>

  <!-- diamond -->
  <rect x="445" y="163" width="10" height="10" transform="rotate(45 450 168)" fill="#B14BF0" filter="url(#hb-ruleglow)"/>

  <!-- bottom gradient rule -->
  <rect x="70" y="194.5" width="760" height="2.5" rx="1.25" fill="url(#hb-rule)" filter="url(#hb-ruleglow)"/>
</svg>
